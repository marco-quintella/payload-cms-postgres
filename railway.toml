[build]
# Railpack is Railway's current builder (Nixpacks is legacy).
# New services do not read this file (Config as Code is closed to new opt-in).
# The marketplace template must set the same deploy.* values in the composer.
builder = "RAILPACK"

[deploy]
# HOSTNAME=0.0.0.0 is required: Railway injects HOSTNAME=<container-id>,
# and the Next.js standalone server listens only on that hostname, so a
# localhost healthcheck fails.
startCommand = "HOSTNAME=0.0.0.0 node .next/standalone/server.js"
# Apply Payload (Drizzle) migrations before the app starts. Idempotent.
preDeployCommand = "npm run db:migrate"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Template wizard prompts are set in the Railway template UI
# (Dashboard → Templates), not in this file.
